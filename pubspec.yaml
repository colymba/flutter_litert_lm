name: ai_edge_litert_lm
description: >-
  A Flutter plugin for on-device LLM inference using Google's LiteRT-LM
  framework. Provides a high-level Conversation API with support for text,
  multimodal (image/audio) inputs, and tool calling, plus on-device text
  embeddings (EmbeddingGemma) via the LiteRT interpreter. Android is supported
  via the official Kotlin SDK, iOS via the official Swift SDK (embeddings are
  Android-only for now).
version: 0.3.0
homepage: https://github.com/colymba/ai_edge_litert_lm
repository: https://github.com/colymba/ai_edge_litert_lm
issue_tracker: https://github.com/colymba/ai_edge_litert_lm/issues
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

flutter:
  plugin:
    platforms:
      android:
        package: dev.colymba.flutter_litert_lm
        pluginClass: FlutterLiteRtLmPlugin
      ios:
        pluginClass: FlutterLiteRtLmPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
