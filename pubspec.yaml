name: flutter_litert_lm
description: >-
  A Flutter plugin for on-device LLM inference using Google's LiteRT-LM
  framework. Provides a high-level Conversation API with support for text,
  multimodal (image/audio) inputs, and tool calling. Android is fully supported
  via the official Kotlin SDK. iOS support will be added when the Swift SDK is
  available.
version: 0.2.1
homepage: https://github.com/colymba/flutter_litert_lm

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

flutter:
  plugin:
    platforms:
      android:
        package: dev.colymba.flutter_litert_lm
        pluginClass: FlutterLiteRtLmPlugin
      ios:
        pluginClass: FlutterLiteRtLmPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
